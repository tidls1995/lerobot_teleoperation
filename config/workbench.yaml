# 작업대(서버) 설정
use_mock: false         # 2단계-A: 실물 팔로워 암 2대. mock 으로 되돌리려면 true.
control_port: 5555      # UDP - 제어 + 텔레메트리
video_port: 5556        # TCP - 영상 3채널 다중화

# 2단계-A: USB 포트 4개가 팔 4대로 차서 카메라를 꽂을 수 없다.
# 첫 실물 조종은 팔을 눈으로 직접 보면서 한다. 2단계-B 에서 아래를 되살린다.
cameras: []
# cameras:
#   - { id: 0, name: front,       index: 0, width: 320, height: 240, fps: 15, jpeg_quality: 80 }
#   - { id: 1, name: wrist_left,  index: 1, width: 320, height: 240, fps: 15, jpeg_quality: 80 }
#   - { id: 2, name: wrist_right, index: 2, width: 320, height: 240, fps: 15, jpeg_quality: 80 }

safety:
  align_threshold_deg: 3.0      # ENGAGED 진입에 필요한 최대 정렬 오차
  max_step_deg: 1.5             # 몸통 관절. 프레임당 최대 이동, 60Hz 기준 90도/초
  gripper_max_step: 4.0         # 그리퍼는 퍼센트 단위. 60Hz 기준 240%/초
  gripper_limits: [0.0, 100.0]
  follow_error_deg: 15.0        # 이 이상 벌어지면 걸림 의심
  follow_error_hold_ms: 500     # 그 상태가 이만큼 지속되면 HOLD
  watchdog_ms: 200              # 제어 패킷 무수신 허용 시간
  # 2026-07-31 실측. 캘리브레이션 파일의 range_min/range_max 를 도로 변환한 뒤
  # (도 = (raw - (min+max)/2) * 360 / 4095) 양쪽으로 8도씩 좁힌 값이다.
  # 참고: 이전의 +-120 은 실제 가동범위보다 넓어서 클램프가 사실상 무효였다.
  #
  # 이것은 팔의 '기구학적' 한계다. 작업대에 실제 장비를 배치한 뒤에는
  # 팔이 그 장비를 치는 자세를 배제하도록 여기서 더 좁혀야 한다.
  # HOLD 에서 R 로 리셋했을 때 팔로워가 되돌아갈 자세 (스펙 §5.1.1).
  # 2026-07-31 에 리더 암에서 떠온 값이다 (tools/capture_home_pose).
  # 리더에서 뜨는 이유: 호밍이 끝나면 조종자가 리더를 이 자세에 맞춰야 정렬이
  # 끝나므로, 리더가 도달할 수 있는 자세여야 한다.
  #
  # elbow_flex 만 실측값 97.3 에서 85.0 으로 낮췄다. 97.3 은 캘리브레이션에 기록된
  # 가동범위 최대치와 같아 팔꿈치가 끝단에 붙은 자세이고, 아래 joint_limits(89/90)
  # 밖이라 설정 검증이 거부한다. 더 접힌 자세가 필요하면 실제 기구학적 스톱을
  # 확인한 뒤 joint_limits 를 넓혀야 한다.
  home_pose:
    left_shoulder_pan:     5.1     # deg
    left_shoulder_lift:  -95.0     # deg
    left_elbow_flex:      85.0     # deg  (실측 97.3 -> 한계 안으로 낮춤)
    left_wrist_flex:      44.4     # deg
    left_wrist_roll:      -9.9     # deg
    left_gripper:          2.1     # percent
    right_shoulder_pan:   -7.4     # deg
    right_shoulder_lift: -90.7     # deg
    right_elbow_flex:     85.0     # deg  (실측 97.3 -> 한계 안으로 낮춤)
    right_wrist_flex:     45.1     # deg
    right_wrist_roll:      7.3     # deg
    right_gripper:         1.4     # percent

  homing_max_step: 0.5          # 호밍 속도. 60Hz 기준 30도/초 (조종은 90도/초)
  homing_tolerance: 1.0         # 이 안으로 들어오면 호밍 완료

  joint_limits:
    left_shoulder_pan:   [-101.0, 101.0]     # 실측 +-109.4
    left_shoulder_lift:  [-102.0, 102.0]     # 실측 +-110.2
    left_elbow_flex:     [ -89.0,  89.0]     # 실측 +-97.3
    left_wrist_flex:     [ -93.0,  93.0]     # 실측 +-101.3
    left_wrist_roll:     [-170.0, 170.0]     # 실측 +-180 (한 바퀴). 되감김 방지로 170
    left_gripper:        [   0.0, 100.0]     # 퍼센트 단위 (도가 아님)
    right_shoulder_pan:  [-104.0, 104.0]     # 실측 +-112.8
    right_shoulder_lift: [ -97.0,  97.0]     # 실측 +-105.4
    right_elbow_flex:    [ -90.0,  90.0]     # 실측 +-98.1
    right_wrist_flex:    [ -96.0,  96.0]     # 실측 +-104.2
    right_wrist_roll:    [-170.0, 170.0]     # 실측 +-180 (한 바퀴). 되감김 방지로 170
    right_gripper:       [   0.0, 100.0]     # 퍼센트 단위 (도가 아님)

# 팔로워 암 2대. 2026-07-31 실측.
# COM 번호는 재부팅하면 바뀔 수 있으므로 시리얼 번호로 지정한다.
# 확인 방법: python -m tools.probe_hardware --ports
arms:
  left:  { serial_number: "5B14033734", calibration_id: "follower_left" }   # COM5 (실측 시점)
  right: { serial_number: "5B14031059", calibration_id: "follower_right" }  # COM4 (실측 시점)
