# 집(클라이언트) 설정
# 3단계: 작업대 PC 의 LAN 주소 (2026-08-03 실측, Wi-Fi 어댑터).
# 사설 IP 라 인터넷에서 접근되지 않는다.
#
# 4단계에서 공인 IP 로 바꿀 때는 **여기에 적어 커밋하지 않는다.**
# 이 저장소는 공개이고 프로토콜이 전부 문서화돼 있어, 공인 IP 를 올리면
# 인증 없는 로봇팔의 조종 주소를 공개하는 셈이 된다.
server_host: "192.168.0.3"
control_port: 5555
video_port: 5556
use_mock: false            # 2단계-A: 실물 리더 암 2대. mock 으로 되돌리려면 true.
client_watchdog_ms: 300    # 텔레메트리 무수신 시 화면 경고까지의 시간

# 리더 암 2대. 2026-07-31 실측.
# COM 번호는 재부팅하면 바뀔 수 있으므로 시리얼 번호로 지정한다.
# 확인 방법: python -m tools.probe_hardware --ports
arms:
  left:  { serial_number: "5B14113336", calibration_id: "leader_left" }   # COM3 (실측 시점)
  right: { serial_number: "5B14030800", calibration_id: "leader_right" }  # COM6 (실측 시점)
